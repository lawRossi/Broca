[project]
name = "broca-tui"
version = "0.1.0"
description = "Terminal User Interface for Broca Agent Framework"
authors = [
    {name = "Rossi", email = "1142595193@qq.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "textual>=7.5.0",
    "aiohttp>=3.11.0",
    "broca>=0.1.0",
    "rich>=14.3.2",
]

[project.scripts]
broca-tui = "broca_tui.app:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["broca_tui*"]
