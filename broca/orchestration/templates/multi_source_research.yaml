# 多源信息搜集模板
# 用于竞品分析、多维度信息搜集等场景
#
# 使用方法:
#   broca run ./templates/multi_source_research.yaml --validate
#   或通过 Web API 提交

name: "多源信息搜集"
description: "多维度信息搜集与分析"

orchestrator:
  type: broadcast

agents:
  - role: dispatcher
    name: "任务分发器"
    config: dispatcher_agent.md

  - role: worker
    name: "市场研究员"
    config: researcher_agent.md

  - role: worker
    name: "技术分析师"
    config: analyst_agent.md

  - role: worker
    name: "用户体验专家"
    config: ux_agent.md

  - role: aggregator
    name: "结果汇总器"
    config: aggregator_agent.md

blackboard:
  initial_entries:
    - key: task
      value: "分析当前 AI 编程助手市场的主要玩家、技术路线和用户评价"
