# 方案评估决策 Demo
# Consensus 编排：多专家独立评估 → 共识聚合
#
# 使用方法:
#   1. 创建 Agent 编排会话，工作目录指向本目录
#   2. 在编排管理页面提交此 YAML
#   3. 或通过 API 提交

name: "方案评估决策"
description: "AI Agent 共识决策：多专家评估远程办公政策方案"

orchestrator:
  type: consensus
  strategy: weighted        # 聚合策略：average/majority/unanimous/weighted
  threshold: 0.7            # 通过阈值 (0.0 - 1.0)
  weights:
    "人力资源专家": 1.0
    "技术经理": 1.0
    "财务分析师": 1.0

agents:
  - role: reviewer
    name: "人力资源专家"
    config: hr_expert.md

  - role: reviewer
    name: "技术经理"
    config: tech_manager.md

  - role: reviewer
    name: "财务分析师"
    config: finance_analyst.md

blackboard:
  initial_entries:
    - key: review_target
      value: |
        # 远程办公政策方案
        
        ## 一、适用范围
        本政策适用于公司全体正式员工（研发、设计、产品等岗位），
        销售人员需线下办公。员工每周可选择最多 3 天远程办公。
        
        ## 二、工作模式
        1. **远程办公日**：周一、周三、周五可选，需提前一天申请
        2. **固定办公日**：周二、周四全员到岗，安排团队会议
        3. **工作时段**：保持 10:00-16:00 核心工作时间在线
        4. **沟通工具**：Slack 即时通讯 + Zoom 视频会议
        
        ## 三、设备与支持
        1. 公司提供笔记本电脑和显示器
        2. 每月发放 300 元远程办公补贴（网络/电费）
        3. IT 部门提供远程技术支持
        
        ## 四、绩效管理
        1. 以结果为导向，不考核工作时长
        2. 每周一提交本周工作计划
        3. 每两周一次 1-on-1 视频会议
        4. 季度 OKR 评估
        
        ## 五、数据安全
        1. 必须使用 VPN 连接公司内网
        2. 禁止在公共 WiFi 处理敏感数据
        3. 所有数据不得下载到本地设备
        
        ## 六、试行安排
        1. 试行期 3 个月
        2. 每月收集员工反馈
        3. 试行期结束后评估效果并决定是否长期执行
