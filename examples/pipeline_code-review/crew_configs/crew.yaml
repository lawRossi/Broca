# 代码审查流水线 Demo — 有向图版 Pipeline
#
# 使用的 Pipeline 特性：
# - 有向图节点（Node）+ 出边（Edge）+ 路由器（Router）
# - static 路由：条件匹配，支持多选（并行扇出）
# - 节点间自动汇聚（fan-in 约束）
# - max_loop 循环控制

name: "代码审查流水线"
description: >
  演示 Pipeline 有向图编排能力：
  1. 代码审查员初步审查
  2. static 路由扇出: 安全审计 + 性能评估（并行）
  3. 质量管理员汇聚结果
  4. 质量评分检查（不达标则循环修复）
  5. 最终批准

orchestrator:
  type: pipeline
  extras:
    graph:
      entry: start
      nodes:
        # ═══════════════════════════════════════════
        # 入口
        # ═══════════════════════════════════════════
        start:
          name: start
          edges:
            - target: static_analysis

        # ═══════════════════════════════════════════
        # Step 1: 静态代码审查
        # ═══════════════════════════════════════════
        static_analysis:
          agent: "代码审查员"
          task: |
            对代码进行全面的静态代码审查：

            ## 检查清单
            1. 代码规范与风格一致性
            2. 逻辑错误与潜在 bug
            3. 代码可读性与维护性
            4. 设计模式和架构合理性
            5. 异常处理完整性
            6. 重复代码和冗余逻辑

            ## 输出格式
            请按以下格式输出审查结果(控制在300字以内）：
            - 总分（1-10）
            - 问题列表（每个问题标注：位置、严重程度【高危/中危/低危】、修改建议）
            - 代码规范评分
            - 总体评价
          edges:
            - target: triage_reviews

        # ═══════════════════════════════════════════
        # Step 2: 路由 — 扇出到安全审查 + 性能审查
        # ═══════════════════════════════════════════
        triage_reviews:
          # static 路由：条件匹配，支持多选
          router:
            mode: static
          edges:
            - target: security_audit
              field: has_security_issues
              operator: eq
              value: true
            - target: performance_review
              field: has_performance_issues
              operator: eq
              value: true
            - target: aggregation
              # 无条件兜底：无需专项审查时直接汇聚

        # 安全审查
        security_audit:
          agent: "安全审计员"
          task: |
            对代码进行安全审查：

            ## 检查清单
            1. SQL/NoSQL 注入风险
            2. XSS 跨站脚本攻击
            3. 敏感信息硬编码
            4. 认证授权缺陷
            5. 依赖库安全漏洞
            6. 输入验证完整性
            7. 数据加密合规性

            ## 输出格式
            请按格式输出（控制在300字以内）：
            - 安全总分（1-10）
            - 安全问题列表（风险等级：高危/中危/低危）
            - 每个问题的修复建议
            - 安全合规结论
          edges:
            - target: aggregation

        # 性能审查
        performance_review:
          agent: "性能工程师"
          task: |
            对代码进行性能审查（控制在300字以内）：

            ## 检查清单
            1. 算法复杂度分析
            2. 数据库查询效率
            3. 内存使用和泄漏风险
            4. 缓存使用合理性
            5. 并发处理正确性
            6. 资源释放完整性
            7. 热点代码识别

            ## 输出格式
            请按格式输出：
            - 性能总分（1-10）
            - 性能问题列表（优先级：P0/P1/P2/P3）
            - 每个问题的优化建议
            - 预期优化效果
          edges:
            - target: aggregation

        # ═══════════════════════════════════════════
        # Step 3: 汇聚 — 汇聚所有审查结果
        # ═══════════════════════════════════════════
        aggregation:
          agent: "质量管理员"
          task: |
            综合前面所有审查结果，完成以下工作：

            1. 汇总代码审查、安全审计、性能评估的报告
            2. 识别跨领域的交叉问题
            3. 给出综合质量评分（1-10分），精确到小数点后一位
            4. 对黑板 key 'quality_score' 写入综合评分（数字）
            5. 列出必须修复的关键问题（按优先级排序）
            6. 评估整体发布风险

            输出格式要求（控制在300字以内）：
            - 综合质量评分: X.X
            - 各维度得分: {规范, 安全, 性能}
            - 关键问题列表
            - 修复建议
            - 风险等级
          extras:
            aggregation_strategy: agent
          edges:
            - target: quality_gate

        # ═══════════════════════════════════════════
        # Step 4: 质量检查 + 条件路由
        # ═══════════════════════════════════════════
        quality_gate:
          agent: "审批员"
          task: |
            基于黑板中的 quality_score，判断代码质量是否达标。

            如果质量达标，将 blackboard key 'gate_passed' 设为 true。
            如果质量不达标，将 'gate_passed' 设为 false，
            并在黑板的 'fix_feedback' 中写入需要重点修复的问题方向（控制在100字以内）。
          max_loop: 3
          router:
            mode: static
          edges:
            - target: final_approval
              field: gate_passed
              operator: eq
              value: true
            - target: fix_issues
              # 兜底：不达标走修复

        # ═══════════════════════════════════════════
        # Step 5: 修复问题（循环回到 static_analysis）
        # ═══════════════════════════════════════════
        fix_issues:
          agent: "程序员"
          task: |
            根据黑板中最近的审查反馈，修复代码问题。

            黑板中有以下有用信息：
            - fix_feedback: 需要修复的问题方向
            - quality_score: 上次评分
            - 历史审查记录

            请在修复时：
            1. 更新代码片段展示修复后的代码
            2. 标注每个问题的修复状态（已修复/部分修复/无法修复）
          max_loop: 3
          edges:
            - target: static_analysis

        # ═══════════════════════════════════════════
        # Step 6: 最终批准
        # ═══════════════════════════════════════════
        final_approval:
          agent: "审批员"
          task: |
            代码已通过所有审查阶段，请输出最终的批准报告：

            1. 审查结论（通过/需观察）
            2. 最终质量评分
            3. 审查迭代次数
            4. 遗留问题（如有）
            5. 合并建议

agents:
  - role: worker
    name: "代码审查员"
    config: code_reviewer.md

  - role: worker
    name: "安全审计员"
    config: security_auditor.md

  - role: worker
    name: "性能工程师"
    config: performance_engineer.md

  - role: worker
    name: "质量管理员"
    config: quality_manager.md

  - role: worker
    name: "审批员"
    config: approver.md
  
  - role: worker
    name: "程序员"
    config: coder.md

blackboard:
  initial_entries:
    - key: code_to_review
      value: |
        def process_user_input(data):
            import sqlite3
            conn = sqlite3.connect('users.db')
            cursor = conn.cursor()

            # 直接拼接 SQL 查询
            query = f"SELECT * FROM users WHERE name = '{data['name']}' AND age > {data['age']}"
            cursor.execute(query)

            # 直接 eval 用户输入
            result = eval(data.get('calc', '1+1'))

            # 硬编码密钥
            API_KEY = "sk-1234567890abcdef"

            # 密码明文存储
            password = data.get('password')
            cursor.execute(f"INSERT INTO users (name, password) VALUES ('{data[\"name\"]}', '{password}')")

            conn.commit()
            return result

    - key: quality_score
      value: 0

    - key: gate_passed
      value: false

    - key: loop_phase
      value: "start"

    - key: fix_feedback
      value: ""
