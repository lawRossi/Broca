# 代码审查流水线 Demo
# Pipeline 编排：多个 Agent 按顺序依次执行
#
# 使用方法:
#   1. 创建 Agent 编排会话，工作目录指向本目录
#   2. 在编排管理页面提交此 YAML
#   3. 或通过 API 提交

name: "代码审查流水线"
description: "AI Agent 流水线：自动化代码审查与质量评估"

orchestrator:
  type: pipeline
  extras:
    steps:
      - agent: "代码审查员"
        task: |
          对以下代码进行全面的静态代码审查。请检查：
          1. 代码规范与风格
          2. 逻辑错误与潜在 bug
          3. 代码可读性与维护性
          4. 设计模式和架构合理性
          
          请给出详细的审查报告，包括问题位置、严重程度和修改建议。
        context: "这是流水线的第一步，请重点关注代码本身的正确性和规范性。"

      - agent: "安全审计员"
        task: |
          对代码进行安全审查。请检查：
          1. SQL/NoSQL 注入风险
          2. XSS 跨站脚本攻击
          3. 敏感信息硬编码
          4. 认证授权缺陷
          5. 依赖库安全漏洞
          
          请列出所有安全问题及其风险等级（高危/中危/低危）。
        context: "这是流水线的第二步，你可以参考代码审查员的输出。"

      - agent: "质量管理员"
        task: |
          综合前两步的审查结果，给出最终的质量评估报告：
          1. 总体质量评分（1-10分）
          2. 代码规范得分
          3. 安全性得分
          4. 主要问题汇总
          5. 改进优先级排序
          6. 建议的操作步骤
        context: "这是流水线的最后一步，请综合所有信息给出最终结论。"

agents:
  - role: worker
    name: "代码审查员"
    config: code_reviewer.md

  - role: worker
    name: "安全审计员"
    config: security_auditor.md

  - role: worker
    name: "质量管理员"
    config: quality_manager.md

blackboard:
  initial_entries:
    - key: code_to_review
      value: |
        def process_user_input(data):
            import sqlite3
            conn = sqlite3.connect('users.db')
            cursor = conn.cursor()
            
            # 直接拼接 SQL 查询
            query = f"SELECT * FROM users WHERE name = '{data['name']}' AND age > {data['age']}"
            cursor.execute(query)
            
            # 直接 eval 用户输入
            result = eval(data.get('calc', '1+1'))
            
            # 硬编码密钥
            API_KEY = "sk-1234567890abcdef"
            
            # 密码明文存储
            password = data.get('password')
            cursor.execute(f"INSERT INTO users (name, password) VALUES ('{data[\"name\"]}', '{password}')")
            
            conn.commit()
            return result
