# 复合工作流示例
# 顺序执行 → 扇出(子Pipeline) → 扇入 → 顺序执行
#
# 用 Pipeline 实现:
# Step 1: Agent           (顺序)
# Step 2: Agent           (顺序)
# Step 3: Fan-out         (并行, 每条分支跑一个子 Pipeline)
# Step 4: Fan-in (agent)  (汇聚)
# Step 5: Agent           (顺序)
# Step 6: Agent           (顺序)

name: "复合工作流 - 顺序→扇出→扇入→顺序"
description: >
  演示 Pipeline 高级编排能力:
  1. 数据工程师准备数据
  2. 分析师初步分析
  3. 扇出: 市场分析 + 技术评估（各自是子 Pipeline, 并行执行）
  4. 扇入: 项目经理汇聚双方结果
  5. 决策者综合决策
  6. 报告撰写员输出最终报告

orchestrator:
  type: pipeline
  extras:
    steps:
      # ── Step 1: 数据准备 ──
      - agent: "数据工程师"
        task: |
          采集并清洗数据:
          1. 从数据源提取原始数据
          2. 清洗和标准化
          3. 输出处理后的数据集

      # ── Step 2: 初步分析 ──
      - agent: "分析师"
        task: |
          对数据进行初步分析:
          1. 数据概况统计
          2. 关键指标计算
          3. 输出初步分析报告

      # ── Step 3: 扇出 — 市场和技术并行分析 ──
      - type: fan-out
        name: "并行分析"
        branches:
          - name: "市场分析"
            crew:
              name: "市场分析工作流"
              orchestrator:
                type: pipeline
              agents:
                - role: worker
                  name: "市场研究员"
                  config: market_researcher.md
                - role: worker
                  name: "竞品分析师"
                  config: competitor_analyst.md
              steps:
                - agent: "市场研究员"
                  task: "分析市场趋势、规模和增长潜力"
                - agent: "竞品分析师"
                  task: "分析主要竞争对手的策略和定位"

          - name: "技术评估"
            crew:
              name: "技术评估工作流"
              orchestrator:
                type: pipeline
              agents:
                - role: worker
                  name: "技术评估员"
                  config: tech_evaluator.md
                - role: worker
                  name: "安全审计员"
                  config: security_auditor.md
              steps:
                - agent: "技术评估员"
                  task: "评估技术可行性、架构方案和技术债务"
                - agent: "安全审计员"
                  task: "评估安全风险、合规性和数据隐私"

      # ── Step 4: 扇入 — 汇聚结果 ──
      - type: fan-in
        name: "结果汇聚"
        aggregation_strategy: agent
        aggregator: "项目经理"
        task: |
          综合市场分析和技术评估的结果:
          1. 识别关键发现和交叉点
          2. 评估整体可行性和风险
          3. 输出统一的综合评估报告

      # ── Step 5: 决策 ──
      - agent: "决策者"
        task: |
          基于综合评估报告做出决策:
          1. 评估方案的优缺点
          2. 给出明确的决策（批准/拒绝/需修改）
          3. 列出决策理由

      # ── Step 6: 输出报告 ──
      - agent: "报告撰写员"
        task: |
          撰写最终综合报告:
          1. 执行摘要
          2. 分析过程和方法
          3. 关键发现（市场+技术）
          4. 决策和理由
          5. 后续建议

agents:
  - role: worker
    name: "数据工程师"
    config: data_engineer.md

  - role: worker
    name: "分析师"
    config: analyst.md

  - role: worker
    name: "市场研究员"
    config: market_researcher.md

  - role: worker
    name: "竞品分析师"
    config: competitor_analyst.md

  - role: worker
    name: "技术评估员"
    config: tech_evaluator.md

  - role: worker
    name: "安全审计员"
    config: security_auditor.md

  - role: worker
    name: "项目经理"
    config: project_manager.md

  - role: worker
    name: "决策者"
    config: decision_maker.md

  - role: worker
    name: "报告撰写员"
    config: reporter.md
