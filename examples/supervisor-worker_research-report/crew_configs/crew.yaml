# 研究报告生成 Demo
# Supervisor-Worker 编排：主管分解任务，工人并行执行
#
# 使用方法:
#   1. 创建 Agent 编排会话，工作目录指向本目录
#   2. 在编排管理页面提交此 YAML
#   3. 或通过 API 提交

name: "研究报告生成"
description: "AI Agent 团队协作：生成 AI 在医疗领域应用的研究报告"

orchestrator:
  type: supervisor-worker
  max_rounds: 2  # 迭代轮数

agents:
  - role: supervisor
    name: "研究主管"
    config: research_director.md

  - role: worker
    name: "文献研究员"
    config: literature_researcher.md

  - role: worker
    name: "数据分析师"
    config: data_analyst.md

  - role: worker
    name: "报告撰写人"
    config: report_writer.md

blackboard:
  initial_entries:
    - key: objective
      value: |
        撰写一份关于「人工智能在医疗领域的应用现状与未来趋势」的深度研究报告。
        
        需要覆盖的方面：
        1. AI 在医学影像诊断中的应用（如 X 光、CT、MRI 的 AI 辅助诊断）
        2. AI 在药物研发中的作用（分子筛选、临床试验优化）
        3. AI 在医疗健康管理中的应用（个性化医疗、健康监测）
        4. 当前面临的技术挑战和伦理问题
        5. 未来 3-5 年的发展趋势预测
        
        报告要求：
        - 总字数 3000-5000 字
        - 包含数据引用和案例
        - 结构清晰，包含摘要、正文、结论和建议
