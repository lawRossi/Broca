# 产品发布决策 Demo
# Composite 编排：Supervisor-Worker 主流程 + Broadcast/Consensus 子流程
#
# 使用方法:
#   1. 创建 Agent 编排会话，工作目录指向本目录
#   2. 在编排管理页面提交此 YAML
#   3. 或通过 API 提交

name: "产品发布决策"
description: "AI Agent 组合编排：产品发布前的全面评估与决策"

orchestrator:
  type: supervisor-worker
  max_rounds: 1

agents:
  # Supervisor - 发布协调员
  - role: supervisor
    name: "发布协调员"
    config: launch_coordinator.md

  # Broadcast 子流程的 Workers
  - role: worker
    name: "市场研究员"
    config: market_researcher.md

  - role: worker
    name: "用户研究员"
    config: user_researcher.md

  - role: worker
    name: "技术评估员"
    config: tech_assessor.md

  # Consensus 子流程的 Reviewers
  - role: reviewer
    name: "业务负责人"
    config: business_director.md

  - role: reviewer
    name: "质量经理"
    config: quality_manager.md

  - role: reviewer
    name: "风险管理员"
    config: risk_manager.md

sub_crews:
  - name: "市场调研分析"
    orchestrator:
      type: broadcast
    agents:
      - role: dispatcher
        name: "发布协调员"
        config: launch_coordinator.md
      - role: worker
        name: "市场研究员"
        config: market_researcher.md
      - role: worker
        name: "用户研究员"
        config: user_researcher.md
      - role: worker
        name: "技术评估员"
        config: tech_assessor.md
      - role: aggregator
        name: "发布协调员"
        config: launch_coordinator.md

  - name: "发布决策评审"
    orchestrator:
      type: consensus
      strategy: weighted
      threshold: 0.7
      weights:
        "业务负责人": 1.5
        "质量经理": 1.0
        "风险管理员": 1.2
    agents:
      - role: reviewer
        name: "业务负责人"
        config: business_director.md
      - role: reviewer
        name: "质量经理"
        config: quality_manager.md
      - role: reviewer
        name: "风险管理员"
        config: risk_manager.md

blackboard:
  initial_entries:
    - key: objective
      value: |
        评估智能健康手环 Pro 版本的产品发布准备情况，做出是否发布的决策。

    - key: product_info
      value: |
        # 智能健康手环 Pro - 产品信息
        
        ## 产品概述
        新一代旗舰智能健康手环，面向运动爱好者和健康管理人群。
        建议零售价：599 元
        
        ## 核心功能
        1. 医疗级心率监测（已通过 FDA 认证）
        2. 血氧饱和度监测（SpO2）
        3. 压力指数与睡眠质量分析
        4. 14 种运动模式自动识别
        5. 5ATM 防水（50 米深度）
        6. 14 天超长续航
        7. 蓝牙 5.3 + NFC 支付
        8. 配套 App（iOS/Android）
        
        ## 开发状态
        - 硬件：已通过量产验证，良品率 97%
        - 固件：v2.0 已完成内部测试
        - App：v3.0 已完成测试
        - 配件：已与 5 家供应商签约
        - 库存：首批 50,000 台已入库
        
        ## 市场情况
        - 预约量：15 万人（开启预约 7 天）
        - 竞品动态：主要竞品预计 2 个月后发布新品
        - 最佳发布窗口：下个月中旬（开学季/健身旺季）
        
        ## 待解决问题
        1. NFC 支付在部分城市存在兼容性问题
        2. App 用户反馈部分功能操作路径过长
        3. 首批 10,000 台的屏幕存在轻微色差（已更换供应商）
