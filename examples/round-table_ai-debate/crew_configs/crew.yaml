# 标准辩论赛 Demo
# 使用 Round-Table 每轮自定义配置实现标准辩论流程
#
# 辩论流程：
#   主持人开场 → 正方立论 → 反方立论
#   → 自由辩论(双方交替) → 正方总结 → 反方总结
#   → 评委评分 → 主持人总结

name: "标准辩论赛"
description: "AI Agent 标准辩论赛：正反双方分阶段辩论，评委打分"

orchestrator:
  type: round-table
  max_rounds: 4
  extras:
    moderator_opening: true
    moderator_closing: true
    speaker_order: moderator

agents:
  - role: moderator
    name: "主持人"
    config: moderator.md

  - role: participant
    name: "正方一辩"
    config: pro1.md
    extras:
      stance: pro

  - role: participant
    name: "正方二辩"
    config: pro2.md
    extras:
      stance: pro
  
  - role: participant
    name: "正方三辩"
    config: pro3.md
    extras:
      stance: pro
  
  - role: participant
    name: "正方四辩"
    config: pro4.md
    extras:
      stance: pro

  - role: participant
    name: "反方一辩"
    config: con1.md
    extras:
      stance: con
    
  - role: participant
    name: "反方二辩"
    config: con2.md
    extras:
      stance: con
  
  - role: participant
    name: "反方三辩"
    config: con3.md
    extras:
      stance: con
    
  - role: participant
    name: "反方四辩"
    config: con4.md
    extras:
      stance: con

  - role: participant
    name: "评委"
    config: judge.md

blackboard:
  initial_entries:
    - key: topic
      value: "人工智能对人类社会究竟是利大于弊还是弊大于利？"
    - key: debate_rules
      value: |
        辩论规则：
        1. 立论阶段：每方各发言一轮，阐述核心论点（控制在200字以内）
        2. 攻辩阶段：双方交替发言，可互相反驳（没人发言控制在200字以内）
        3. 总结陈词：每方总结核心观点（控制在200字以内）
        4. 保持理性和建设性的辩论态度
